# CFB FBS: the repo's own recipes (models.build_xgb / build_lr, zero-imputation) walked forward season by season against Elo and the
# always-home prior. The repo models FBS and FCS separately but on ONE shared Elo pool, so features come from the full export and this
# spec only FILTERS to one division afterwards. Trains on every earlier season; scores 2019-2024 (5 seasons of history first).
# 2025 is the repo's touch-once holdout and is not in the export. Input: scripts/football/stage_export.sh + job_cfb.yaml + mllab data promote.
name: cfb_fbs_walkforward
data: {file: cfb_features.parquet}
env_lock: ../scripts/football/requirements.lock
filter: {column: division, equals: fbs}
label: home_won
date: game_date
id: game_id
timeout_s: 3000
columns:
  - {name: elo, column: elo_home_win_prob}
retrain:
  - name: xgb
    features: {all_numeric: true, exclude: [season, week, spread_line, total_line]}
    family: xgboost
    impute: zero
    params: {max_depth: 3, min_child_weight: 20, learning_rate: 0.03, n_estimators: 400, subsample: 0.8, colsample_bytree: 0.6, gamma: 0.5, reg_lambda: 5.0, tree_method: hist, n_jobs: 2}
    seeds: [1, 2, 3]
    walk_forward: {group: season, min_groups: 5}
  - name: lr
    features: {all_numeric: true, exclude: [season, week, spread_line, total_line]}
    family: logreg
    impute: zero
    params: {C: 0.1}
    walk_forward: {group: season, min_groups: 5}
thresholds: [0.5, 0.55, 0.6, 0.65]
bootstrap: 2000
