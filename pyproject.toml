[project]
name = "mllab"
version = "0.1.0"
description = "Private ML model lab: registry, BQ guard, job runner, GCP deploy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "duckdb>=1.0",
  "pyarrow>=16",
  "google-cloud-bigquery>=3.25",
  "db-dtypes>=1.2",
  "google-cloud-bigquery-storage>=2.25",
  "google-cloud-storage>=2.18",
  "pyyaml>=6",
  "google-genai>=1.0",
]

[project.optional-dependencies]
lab = ["jupyterlab>=4", "papermill>=2.6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
mllab = "mllab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mllab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
